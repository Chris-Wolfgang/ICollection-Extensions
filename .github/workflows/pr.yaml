# DEMO (claude-sessions standards/workflows.md item 2): this repository's PR gate delivered as a
# call to repo-template's pr.yaml instead of a 1,848-line copy of it.
#
# - `core` runs the template workflow (secrets scan, detect projects, changelog check,
#   InspectCode, Stage 1/2/3, DevSkim) with this repository's code and event context.
# - Any job this repository needs on top goes below with `needs: core`, so it runs after the
#   whole core passes and is a required check like any other.
# - Permissions: a called workflow may only use what the caller grants, so the two write scopes
#   that inspectcode-upload declares are granted here at the top level.
# - The ref after `@` is a commit SHA because the fleet requires hash-pinned actions
#   (zizmor/unpinned-uses); the trailing comment names the template branch it was taken from.

name: PR Checks v3 (Gated)

permissions:
  contents: read
  security-events: write
  actions: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  core:
    uses: Chris-Wolfgang/repo-template/.github/workflows/pr.yaml@bfb5e92d4d45f9a701f538fd98bca756a3b34103 # demo/reusable-pr-workflow-call
    secrets: inherit

  # Example of a per-repo job that stays in this file and runs after the core.
  after-core:
    name: "Demo: per-repo job after core"
    runs-on: ubuntu-latest
    needs: core
    steps:
      - run: echo "core passed; a repo-specific suite (integration tests, docker) would run here"
