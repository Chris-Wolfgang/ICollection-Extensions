name: "Reproducible Build Verification"

# Builds and packs the same commit on ubuntu-latest and windows-latest and requires every shipped
# assembly and its .pdb to be byte-identical across the two runners (#178). The .nupkg / .snupkg
# are compared entry by entry and the result is reported in the job summary, not gated: the zip
# container carries pack-time stamps and platform attributes, and NuGet and the compiler write a few
# entries with the machine newline. The packages are packed with SOURCE_DATE_EPOCH set to the commit
# time, which NuGet uses as the zip entry timestamp (DeterministicTimestamp).
# Interim: the fleet standard replaces this file with one canonical copy from repo-template (a
# same-OS double-build gate plus this cross-OS report); take that copy when it lands.
# Directory.Build.props
# sets ContinuousIntegrationBuild under CI (path-mapped, deterministic output) and SourceLink
# embeds the same GitHub URL on both, so any difference is a real reproducibility break.
# How a third party verifies a published package is documented separately (docs/REPRODUCIBLE-BUILD.md).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 2'  # weekly Tuesday 07:00 UTC

permissions:
  contents: read

jobs:
  build:
    name: "Build (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release, ContinuousIntegrationBuild)
        # CI=true is already set by GitHub Actions, which flips
        # Directory.Build.props's ContinuousIntegrationBuild condition —
        # no extra property needed. Deterministic defaults to true for
        # Release builds in the modern SDK.
        run: dotnet build --no-restore --configuration Release

      - name: Pack (SOURCE_DATE_EPOCH = commit time)
        shell: bash
        run: |
          # NuGet's pack targets turn SOURCE_DATE_EPOCH into DeterministicTimestamp, the
          # timestamp written on every zip entry. The commit time is the same on every runner.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" --no-build --configuration Release --output packages
          done

      - name: Hash per-TFM assemblies
        shell: pwsh
        run: |
          # One package's worth of hashes per iteration — the repo may
          # ship more than one independently-versioned package under src/.
          #
          # Filter to OUR assembly by name, not '*.dll': an output directory can also hold
          # copied dependency DLLs, whose hashes say nothing about this repo's build.
          $srcProjects = Get-ChildItem -Path 'src' -Recurse -Filter '*.csproj'

          $hashes = foreach ($proj in $srcProjects) {
            $packageId = $proj.BaseName
            # The .pdb is hashed too: it records the compiled sources and references, so a
            # .pdb difference is a reproducibility failure even when the .dll matches.
            $assemblies = Get-ChildItem -Path "src/$packageId/bin/Release" -Recurse -Include "$packageId.dll", "$packageId.pdb" |
              Where-Object { $_.Directory.Name -ne 'ref' }

            foreach ($asm in $assemblies) {
              [pscustomobject]@{
                packageId = $packageId
                tfm  = $asm.Directory.Name
                file = $asm.Name
                sha256 = (Get-FileHash -Path $asm.FullName -Algorithm SHA256).Hash
              }
            }
          }

          # The packages are compared entry by entry, never as zip files: the container carries
          # pack-time stamps and platform attributes (fleet standard, reproducible-builds.md), so a
          # whole-file hash differs between operating systems with identical content. `entries` lists
          # every entry's name and content hash, so a mismatch shows exactly which entry differs.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Get-PackageEntries([string] $path) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($path)
            try {
              $names = [string[]] $zip.Entries.FullName
              [System.Array]::Sort($names, [System.StringComparer]::Ordinal)
              foreach ($name in $names) {
                $stream = $zip.GetEntry($name).Open()
                try {
                  $sha = [System.Security.Cryptography.SHA256]::Create()
                  $hash = [System.BitConverter]::ToString($sha.ComputeHash($stream)).Replace('-', '')
                } finally {
                  $stream.Dispose()
                }
                "$name`t$hash"
              }
            } finally {
              $zip.Dispose()
            }
          }

          $packages = Get-ChildItem -Path 'packages' -File -Include '*.nupkg', '*.snupkg' -Recurse
          $hashes = @($hashes) + @(foreach ($pkg in $packages) {
            $entries = @(Get-PackageEntries $pkg.FullName)
            $bytes = [System.Text.Encoding]::UTF8.GetBytes(($entries -join "`n"))
            [pscustomobject]@{
              packageId = ($pkg.Name -replace '\.\d+\.\d+\.\d+.*$', '')
              tfm  = 'package'
              file = $pkg.Name
              sha256 = [System.BitConverter]::ToString([System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)).Replace('-', '')
              entries = $entries
            }
          })
          if (-not $packages) {
            Write-Error 'dotnet pack produced no .nupkg - nothing to compare.'
            exit 1
          }

          $hashes | Sort-Object packageId, tfm, file | ConvertTo-Json -AsArray | Out-File -FilePath 'assembly-hashes-${{ matrix.os }}.json' -Encoding utf8
          $hashes | Format-Table -AutoSize

      - name: Upload hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: assembly-hashes-${{ matrix.os }}
          path: assembly-hashes-${{ matrix.os }}.json

  compare:
    name: "Compare hashes across runners"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download all hash artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: assembly-hashes-*
          path: hashes
          merge-multiple: false

      - name: Compare ubuntu-latest vs windows-latest hashes
        shell: bash
        run: |
          set -e
          ubuntu=$(find hashes -path '*ubuntu*' -name '*.json' | head -1)
          windows=$(find hashes -path '*windows*' -name '*.json' | head -1)

          if [ -z "$ubuntu" ] || [ -z "$windows" ]; then
            echo "::error::Could not locate both hash artifacts (ubuntu: '$ubuntu', windows: '$windows')."
            exit 1
          fi

          echo "Comparing $ubuntu against $windows"

          # GATE: every shipped assembly and its .pdb, per TFM, must be byte-identical across the
          # two runners. If this fails, compare the per-TFM .pdb documents and referenced-assembly
          # records first. In sibling repos the inputs that differed between Linux and Windows were a
          # generated source written with a different newline and a different .NET Framework
          # reference assembly (IEnumerable-Extensions #533).
          asm() { jq -S '[.[] | select(.tfm != "package") | {packageId, tfm, file, sha256}] | sort_by(.packageId, .tfm, .file)' "$1"; }
          if ! diff <(asm "$ubuntu") <(asm "$windows"); then
            echo "::error::Assembly or symbol hashes diverge between ubuntu-latest and windows-latest — build is not reproducible across runners."
            exit 1
          fi
          echo "✅ Byte-identical assemblies and symbols across ubuntu-latest and windows-latest."

          # REPORT: the packages. Cross-OS identity of the package entries is reported, never gated
          # (fleet reproducible-builds standard): NuGet writes the .nuspec, [Content_Types].xml,
          # _rels/.rels and the .psmdcp part, and the compiler writes the XML documentation, with
          # the build machine's newline, so those entries differ between operating systems with
          # identical content. Entries that differ are listed so a real packaging change still shows.
          differing=$(jq -nr --slurpfile u "$ubuntu" --slurpfile w "$windows" '
            def entries: reduce (.[] | select(.tfm == "package") | .file as $p | .entries[] | split("\t")
                                  | {key: "\($p) :: \(.[0])", value: .[1]}) as $e ({}; .[$e.key] = $e.value);
            ($u[0] | entries) as $a | ($w[0] | entries) as $b
            | (($a | keys) + ($b | keys) | unique)[] | select($a[.] != $b[.])')
          {
            echo "### Package entries, ubuntu-latest vs windows-latest (reported, not gated)"
            echo ""
            if [ -z "$differing" ]; then
              echo "All package entries match."
            else
              echo "Entries whose content differs between the two runners:"
              echo ""
              echo "$differing" | sed 's/^/- /'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
