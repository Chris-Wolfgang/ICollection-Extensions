name: "Reproducible Build Verification"

# Builds the same commit on ubuntu-latest and windows-latest and requires every shipped
# assembly and its .pdb to be byte-identical across the two runners (#178). Directory.Build.props
# sets ContinuousIntegrationBuild under CI (path-mapped, deterministic output) and SourceLink
# embeds the same GitHub URL on both, so any difference is a real reproducibility break.
# How a third party verifies a published package is documented separately (docs/REPRODUCIBLE-BUILD.md).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 2'  # weekly Tuesday 07:00 UTC

permissions:
  contents: read

jobs:
  build:
    name: "Build (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release, ContinuousIntegrationBuild)
        # CI=true is already set by GitHub Actions, which flips
        # Directory.Build.props's ContinuousIntegrationBuild condition —
        # no extra property needed. Deterministic defaults to true for
        # Release builds in the modern SDK.
        run: dotnet build --no-restore --configuration Release

      - name: Hash per-TFM assemblies
        shell: pwsh
        run: |
          # One package's worth of hashes per iteration — the repo may
          # ship more than one independently-versioned package under src/.
          #
          # Filter to OUR assembly by name, not '*.dll': an output directory can also hold
          # copied dependency DLLs, whose hashes say nothing about this repo's build.
          $srcProjects = Get-ChildItem -Path 'src' -Recurse -Filter '*.csproj'

          $hashes = foreach ($proj in $srcProjects) {
            $packageId = $proj.BaseName
            # The .pdb is hashed too: it records the compiled sources and references, so a
            # .pdb difference is a reproducibility failure even when the .dll matches.
            $assemblies = Get-ChildItem -Path "src/$packageId/bin/Release" -Recurse -Include "$packageId.dll", "$packageId.pdb" |
              Where-Object { $_.Directory.Name -ne 'ref' }

            foreach ($asm in $assemblies) {
              [pscustomobject]@{
                packageId = $packageId
                tfm  = $asm.Directory.Name
                file = $asm.Name
                sha256 = (Get-FileHash -Path $asm.FullName -Algorithm SHA256).Hash
              }
            }
          }

          $hashes | Sort-Object packageId, tfm, file | ConvertTo-Json -AsArray | Out-File -FilePath 'assembly-hashes-${{ matrix.os }}.json' -Encoding utf8
          $hashes | Format-Table -AutoSize

      - name: Upload hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: assembly-hashes-${{ matrix.os }}
          path: assembly-hashes-${{ matrix.os }}.json

  compare:
    name: "Compare hashes across runners"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download all hash artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: assembly-hashes-*
          path: hashes
          merge-multiple: false

      - name: Compare ubuntu-latest vs windows-latest hashes
        shell: bash
        run: |
          set -e
          ubuntu=$(find hashes -path '*ubuntu*' -name '*.json' | head -1)
          windows=$(find hashes -path '*windows*' -name '*.json' | head -1)

          if [ -z "$ubuntu" ] || [ -z "$windows" ]; then
            echo "::error::Could not locate both hash artifacts (ubuntu: '$ubuntu', windows: '$windows')."
            exit 1
          fi

          echo "Comparing $ubuntu against $windows"
          if diff <(jq -S 'sort_by(.packageId, .tfm, .file)' "$ubuntu") <(jq -S 'sort_by(.packageId, .tfm, .file)' "$windows"); then
            echo "✅ Byte-identical assemblies and symbols across ubuntu-latest and windows-latest."
          else
            # If this fails, compare the per-TFM .pdb documents and referenced-assembly records
            # first. In sibling repos the inputs that differed between Linux and Windows were a
            # generated source written with a different newline and a different .NET Framework
            # reference assembly (IEnumerable-Extensions #533).
            echo "::error::Assembly or symbol hashes diverge between ubuntu-latest and windows-latest — build is not reproducible across runners."
            exit 1
          fi
