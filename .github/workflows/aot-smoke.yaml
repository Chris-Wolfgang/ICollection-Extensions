name: "AOT/Trim Smoke Test"

# Publishes tests/AotSmoke (a consumer that calls every public method) with Native AOT +
# trimming on linux-x64 and runs the binary; a trimmed member or an AOT-unsafe code path makes
# it exit non-zero (#175). Native AOT can only publish for the OS it runs on, hence a dedicated
# Linux job rather than a step in pr.yaml's Windows/macOS stages. Not path-filtered, so it can
# be made a required status check without leaving PRs waiting on a check that never runs.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aot-smoke:
    name: "Native AOT publish + run (linux-x64)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The ubuntu-latest image normally ships clang and zlib1g-dev, so apt is skipped when
      # both are present. apt runs only as a fallback, with retries, because a single
      # `apt-get update` fails the job whenever the runner cannot resolve the Ubuntu mirrors.
      - name: Install Native AOT prerequisites
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1 \
            && dpkg-query -W -f='${Status}' zlib1g-dev 2>/dev/null | grep -q 'install ok installed'; then
            echo "clang ($(clang --version | head -n 1)) and zlib1g-dev are on the runner image; apt not needed."
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y clang zlib1g-dev; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt of 3 failed; retrying in $((attempt * 30)) s."
            sleep $((attempt * 30))
          done
          echo "::error::clang and zlib1g-dev could not be installed after 3 apt attempts."
          exit 1

      - name: Publish AotSmoke (linux-x64, AOT + trimmed)
        run: >
          dotnet publish tests/AotSmoke/AotSmoke.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output ./aot-smoke-publish

      - name: Run the published AOT binary
        run: ./aot-smoke-publish/AotSmoke
